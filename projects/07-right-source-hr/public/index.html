<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Right Source HR — Recruitment Platform</title>
  <style>
    body { background: #030712; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 30px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
    h1 { color: #00F0FF; font-family: monospace; margin: 0; }
    .badge { font-family: monospace; font-size: 11px; padding: 4px 8px; border-radius: 6px; background: rgba(0,240,255,0.1); color: #00F0FF; border: 1px solid rgba(0,240,255,0.3); }
    .job-card { background: #0B0F19; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin-top: 20px; }
    .job-title { font-size: 20px; font-weight: bold; margin: 0; }
    .job-meta { font-size: 13px; color: #94a3b8; font-family: monospace; margin: 8px 0; }
    button { background: linear-gradient(135deg, #00F0FF, #3B82F6); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #030712; }
    button:hover { opacity: 0.9; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .modal-content { background: #0B0F19; border: 1px solid rgba(0,240,255,0.3); border-radius: 16px; padding: 30px; max-width: 500px; width: 100%; }
    input { width: 100%; box-sizing: border-box; background: #030712; border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; color: #fff; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Right Source HR</h1>
        <p style="color: #94a3b8; margin: 5px 0 0;">Intelligent Recruitment &amp; Applicant Tracking • Built by Arif Shekh</p>
      </div>
      <span class="badge">ACTIVE PORTAL</span>
    </header>

    <h2>Open Requisitions</h2>
    <div id="jobList">Loading job listings...</div>
  </div>

  <div id="applyModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:#00F0FF;">Submit Application</h3>
      <form id="applyForm">
        <input type="hidden" id="applyJobId">
        <label style="font-size:12px; font-family:monospace; color:#94a3b8;">FULL NAME</label>
        <input type="text" id="candName" required placeholder="Alex Johnson">
        <label style="font-size:12px; font-family:monospace; color:#94a3b8;">EMAIL ADDRESS</label>
        <input type="email" id="candEmail" required placeholder="alex@gmail.com">
        <label style="font-size:12px; font-family:monospace; color:#94a3b8;">PORTFOLIO / GITHUB LINK</label>
        <input type="url" id="candPort" placeholder="https://github.com/alex">
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
          <button type="button" onclick="closeModal()" style="background:#1e293b; color:#fff;">Cancel</button>
          <button type="submit">Submit Application</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function loadJobs() {
      fetch('/api/jobs')
        .then(r => r.json())
        .then(jobs => {
          const list = document.getElementById('jobList');
          list.innerHTML = jobs.map(j => `
            <div class="job-card">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <h3 class="job-title">${j.title}</h3>
                  <div class="job-meta">${j.department} • ${j.location} • ${j.salary} • ${j.type}</div>
                </div>
                <button onclick="openApply(${j.id})">Apply Now</button>
              </div>
              <p style="color:#cbd5e1; font-size:14px; margin-top:12px;">${j.description}</p>
            </div>
          `).join('');
        });
    }

    function openApply(id) {
      document.getElementById('applyJobId').value = id;
      document.getElementById('applyModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('applyModal').style.display = 'none';
    }

    document.getElementById('applyForm').onsubmit = (e) => {
      e.preventDefault();
      const payload = {
        jobId: document.getElementById('applyJobId').value,
        candidateName: document.getElementById('candName').value,
        email: document.getElementById('candEmail').value,
        portfolioUrl: document.getElementById('candPort').value,
      };

      fetch('/api/applications', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(r => r.json()).then(res => {
        alert(res.message);
        closeModal();
      });
    };

    loadJobs();
  </script>
</body>
</html>
